apiVersion: v1
kind: Pod
metadata:
  name: secret-test
spec:
  restartPolicy: Never
  containers:
    - name: secret-test
      image: busybox:1.36
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_USER
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secret
          readOnly: true
      command:
        - sh
        - -c
        - |
          echo "DB user (from env): $DB_USER"
          echo "Files in /etc/secret:"
          ls /etc/secret
          sleep 3600
  volumes:
    - name: secret-volume
      secret:
        secretName: app-secret
